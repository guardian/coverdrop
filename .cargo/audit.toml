[advisories]
ignore = [
    # `sodiumoxide` is not in active development mode, but it will
    # be patched if security issues arise. Fore more details, see
    # https://rustsec.org/advisories/RUSTSEC-2021-0137
    "RUSTSEC-2021-0137",

    # `rsa` is a transitive dependency of `sqlx-mysql`. Due to a non-constant
    # time implementation, information about the private key is leaked through
    # timing information which is observable over the network.
    # https://rustsec.org/advisories/RUSTSEC-2023-0071.html
    # This does not affect us, as we do not use `sqlx-mysql`; however, it shows up
    # in the lockfile. This is a known issue with the way cargo deals with weak
    # dependencies. The issue is tracked here:
    # https://github.com/rust-lang/cargo/issues/10801
    "RUSTSEC-2023-0071",

    # This is a potential vuln in SQLx which is currently not addresses, see more
    # https://github.com/launchbadge/sqlx/issues/3440
    #
    # As soon as this vuln is addressed we will apply the appropriate patches, but for now
    # it is mitigated by our Axum server having limits on the size of POST bodies to 2 MiB.
    "RUSTSEC-2024-0363",

    # `libcrux-kem` 0.0.9 comes from `hpke-rs` 0.7.0, which declares `hpke-rs-libcrux`
    # as an optional normal dependency gated behind hpke-rs's own "libcrux" feature,
    # plus an unconditional dev-dependency (used only for hpke-rs's own test suite).
    # `openmls_rust_crypto` only requests hpke-rs features = ["hazmat", "serialization",
    # "experimental"] and never enables "libcrux", so the optional edge is never
    # activated in our build; the dev-dependency is only compiled when testing
    # hpke-rs itself. `cargo tree -i libcrux-kem` confirms it is unreachable from
    # any of our workspace crates. There is currently no upgrade path: `hpke-rs-libcrux`
    # 0.7.0 pins `libcrux-kem = "=0.0.9"` exactly, and the fixed `libcrux-kem` 0.0.10 is
    # only available via `hpke-rs-libcrux` 0.8.0 / `hpke-rs` 0.8.0, which
    # `openmls_rust_crypto`'s `hpke = "^0.7"` requirement does not permit.
    # https://rustsec.org/advisories/RUSTSEC-2026-0331.html
    "RUSTSEC-2026-0331",
    # Same unreachable dev-dependency issue as RUSTSEC-2026-0331 above.
    # https://rustsec.org/advisories/RUSTSEC-2026-0330.html
    "RUSTSEC-2026-0330",

    # `crypto-bigint` 0.5.5 has timing variability issues in operations intended to be
    # constant-time. It comes from `elliptic-curve` 0.13, which is pinned by `p256`/`p384`
    # 0.13 used by `openmls_rust_crypto` 0.6.0 and `openmls_basic_credential` 0.6.0.
    # The fix requires `crypto-bigint` >=0.7.6, which needs the `elliptic-curve` 0.14 chain;
    # there is currently no upgrade path as openmls does not yet support it.
    # The MLS (group messaging) code is not yet run in production, so this is
    # accepted for now. Revisit once openmls moves to `p256` 0.14.
    # https://rustsec.org/advisories/RUSTSEC-2026-0387
    "RUSTSEC-2026-0387",
]
