# The list of rules can be found at
# https://realm.github.io/SwiftLint/rule-directory.html

# Used by scripts/run_swiftlint.sh to pin the SwiftLint version/artifact used on Xcode Cloud and locally.
swiftlint_version: "0.65.0"
swiftlint_portable_zip_sha256: "d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6"

excluded:
  - Carthage
  - Pods
  - ".build"
  - "CoverDropCore/.build"
  - "CoverDropUserInterface/.build"
  - Packages
  - SourcePackages

disabled_rules:
  - force_cast
  - cyclomatic_complexity
  - nesting
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - closure_body_length
  - function_body_length
  - type_body_length
  - file_length
  - block_based_kvo
  - notification_center_detachment
  - switch_case_alignment
  - todo

line_length:
  warning: 120
  error: 120
  ignores_function_declarations: true
  ignores_urls: true
